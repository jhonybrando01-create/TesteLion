<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Visualizador de Produtos - Lion Fitness</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- O <model-viewer> é inserido aqui dinamicamente pelo js/main.js -->
    <main id="ar-container" aria-live="polite">
        <div id="loader" class="loader" role="status">
            <div class="spinner" aria-hidden="true"></div>
            <span>Carregando produto…</span>
        </div>
    </main>

    <!-- Biblioteca <model-viewer> (versão fixa) -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

    <!-- Script principal (module = executa depois do model-viewer acima) -->
    <script type="module" src="/js/main.js"></script>
</body>
</html>
